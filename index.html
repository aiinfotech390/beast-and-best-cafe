<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
        }

        header {
            background: #222;
            color: white;
            padding: 40px 20px;
        }

        .content {
            padding: 40px 20px;
        }

        button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #e05500;
        }
    </style>
</head>

<body>

    <header>
        <h1>My First Website</h1>
        <p>Welcome to my website!</p>
    </header>

    <div class="content">
        <h2>Hello 👋</h2>
        <p>I created this website myself.</p>

        <button onclick="alert('Welcome! Your website is working 🎉')">
            Click Me
        </button>
    </div>

</body>
</html>
